<div style="width:100%; overflow:hidden;">
  <style>
    .carousel {
      position: relative;
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      border-radius: 10px;
      margin: auto;
    }
    .carousel-images {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .carousel-images img {
      width: 100%;
      flex-shrink: 0;
    }
    .carousel-buttons {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }
    .carousel-buttons button {
      background-color: rgba(0,0,0,0.5);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 0 1rem;
      cursor: pointer;
    }
    .carousel-dots {
      text-align: center;
      margin-top: 10px;
    }
    .carousel-dots span {
      display: inline-block;
      height: 10px;
      width: 10px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
    }
    .carousel-dots .active {
      background-color: #333;
    }
  </style>

  <div class="carousel">
    <div class="carousel-images" id="carousel-images">
     <img src="imagenes/foto1.jpg" alt="Imagen 1" width="400" height="300">
      <img src="imagenes/foto2.jpg" alt="Imagen 2" width="400" height="300" >
      <img src="imagenes/foto3.jpg" alt="Imagen 3" width="400" height="300">
      <img src="imagenes/foto4.jpg" alt="imagen 4" width="400" height="300">
      <img src="imagenes/foto5.jpg" alt="imagen 5" width="400" height="300">
      <img src="imagenes/foto6.jpg" alt="imagen 6" width="400" height="300"> 
    </div>

    <div class="carousel-buttons">
      <button onclick="prevSlide()">&#10094;</button>
      <button onclick="nextSlide()">&#10095;</button>
    </div>
    <div class="carousel-dots" id="carousel-dots"></div>
  </div>

  <script>
    const images = document.getElementById('carousel-images');
    const dotsContainer = document.getElementById('carousel-dots');
    const totalSlides = images.children.length;
    let index = 0;

    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('span');
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }

    const dots = dotsContainer.querySelectorAll('span');
    dots[0].classList.add('active');

    function updateCarousel() {
      images.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach(dot => dot.classList.remove('active'));
      dots[index].classList.add('active');
    }

    function nextSlide() {
      index = (index + 1) % totalSlides;
      updateCarousel();
    }

    function prevSlide() {
      index = (index - 1 + totalSlides) % totalSlides;
      updateCarousel();
    }

    function goToSlide(i) {
      index = i;
      updateCarousel();
    }
  </script>
</div>
